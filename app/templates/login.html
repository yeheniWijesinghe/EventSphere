{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="page-head"><div><h1>Welcome back</h1><p class="lede">Sign in to see your tickets and book events.</p></div></div>
  <div class="card"><div class="card-body">
    {% if error %}<div class="alert alert-danger py-2">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <input type="hidden" name="next" value="{{ next }}">
      <div class="mb-3"><label class="form-label" for="email">Email</label>
        <input type="email" name="email" id="email" class="form-control" value="{{ email or '' }}" autocomplete="username" required autofocus></div>
      <div class="mb-3"><label class="form-label" for="password">Password</label>
        <input type="password" name="password" id="password" class="form-control" autocomplete="current-password" required></div>
      <button class="btn btn-es btn-lg w-100">Sign in</button>
    </form>
  </div></div>
  <p class="text-center mt-3">New here? <a href="/register">Create an attendee account</a></p>
</div>
{% endblock %}
