{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="auth-wrap">
  <h1 class="mb-1">Create your account</h1>
  <p class="lede mb-3">Book tickets, join waitlists and hire venues.</p>
  <div class="card"><div class="card-body">
    {% if error %}<div class="alert alert-danger py-2">{{ error }}</div>{% endif %}
    <form method="post" action="/register">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="mb-3"><label class="form-label" for="name">Full name</label>
        <input type="text" name="name" id="name" class="form-control" value="{{ form.name if form else '' }}" autocomplete="name" required></div>
      <div class="mb-3"><label class="form-label" for="email">Email</label>
        <input type="email" name="email" id="email" class="form-control" value="{{ form.email if form else '' }}" autocomplete="username" required></div>
      <div class="mb-3"><label class="form-label" for="password">Password</label>
        <input type="password" name="password" id="password" class="form-control" minlength="8" autocomplete="new-password" required aria-describedby="pwHint">
        <div id="pwHint" class="form-text">At least 8 characters.</div></div>
      <div class="mb-3"><label class="form-label" for="confirm">Confirm password</label>
        <input type="password" name="confirm" id="confirm" class="form-control" minlength="8" autocomplete="new-password" required></div>
      <button class="btn btn-es btn-lg w-100">Create account</button>
    </form>
  </div></div>
  <p class="text-center mt-3">Already registered? <a href="/login">Sign in</a></p>
</div>
{% endblock %}
