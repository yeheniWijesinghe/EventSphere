# Render Blueprint: New > Blueprint > pick this repo. Creates the web service + a free PostgreSQL database.
services:
  - type: web
    name: eventsphere
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # One worker: agents keep their beliefs in memory (persisted to the DB after every message).
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: APP_TIMEZONE
        value: Asia/Colombo
      - key: DATABASE_URL
        fromDatabase:
          name: eventsphere-db
          property: connectionString
      - key: DEMO_ADMIN_PASSWORD
        sync: false
      - key: DEMO_STAFF_PASSWORD
        sync: false
      - key: DEMO_ATTENDEE_PASSWORD
        sync: false

databases:
  - name: eventsphere-db
    plan: free
