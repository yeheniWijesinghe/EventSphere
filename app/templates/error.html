{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="empty my-4" style="max-width: 560px; margin-left: auto; margin-right: auto">
  <i class="bi bi-sign-stop text-danger"></i>
  <h1 class="h3 mt-2">{{ title }}</h1>
  <p>{{ message }}</p>
  <div class="d-flex gap-2 justify-content-center">
    <a href="/" class="btn btn-es">Back to events</a>
    {% if not user %}<a href="/login" class="btn btn-outline-secondary">Sign in</a>{% endif %}
  </div>
</div>
{% endblock %}
